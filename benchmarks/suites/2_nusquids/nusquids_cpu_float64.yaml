# nuSQuIDS, one thread, float64. Each case is checked against the tpeanuts reference before it is timed. Solar scenarios are
# recorded as unavailable. At MeV energies the Earth takes about 0.4-1 s per point, hence the small max_points.
name: nusquids_cpu_float64
series: 2_nusquids
backend: nusquids
description: nuSQuIDS, one thread, float64, paired with the numerical method of tpeanuts
repeats: 7
max_points: 2000
smoke: {repeats: 3, max_points: 50}
cost: {class: expensive}
condor: {request_cpus: 1, request_memory: 8 GB, after: [3_peanuts/peanuts_analytical_cpu_float64]}
